<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Stackly</title>
    <meta name="theme-color" content="#08050f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <noscript><meta http-equiv="refresh" content="0;url=./home.html"></noscript>

    <style>
        :root {
            --bg: #08050f;
            --bg-2: #0d0818;
            --card: #120c22;
            --border: rgba(255, 255, 255, .08);
            --purple-500: #8b5cf6;
            --purple-400: #a78bfa;
            --purple-dark: #3c1090;
            --white: #ffffff;
            --gray-300: #c7c5d1;
            --gray-500: #6f6d7d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(60% 50% at 50% 0%, rgba(139, 92, 246, .16), transparent 70%),
                radial-gradient(70% 60% at 85% 100%, rgba(60, 16, 144, .22), transparent 65%),
                var(--bg);
            color: var(--white);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
            overflow: hidden;
        }

        .loader {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeUp .6s ease forwards;
            transition: opacity .35s ease;
        }

        .loader.leaving {
            opacity: 0;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: clamp(26px, 6vw, 32px);
            letter-spacing: -.02em;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 46px;
        }

        .logo .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--purple-500);
            box-shadow: 0 0 0 5px rgba(139, 92, 246, .18);
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.35);
                opacity: .7;
            }
        }

        /* ---- signature: shipment traveling a route ---- */
        .route {
            position: relative;
            width: min(280px, 72vw);
            height: 28px;
            margin-bottom: 28px;
        }

        .route svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .route-line {
            fill: none;
            stroke: var(--border);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-dasharray: 1 10;
        }

        .route-marker {
            position: absolute;
            top: 50%;
            left: 0;
            width: 26px;
            height: 26px;
            margin-top: -13px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--purple-500), var(--purple-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--white);
            box-shadow: 0 4px 18px rgba(139, 92, 246, .45);
            animation: travel 2.4s cubic-bezier(.65, 0, .35, 1) infinite;
        }

        @keyframes travel {
            0% {
                left: 0;
                opacity: 0;
            }

            8% {
                opacity: 1;
            }

            92% {
                opacity: 1;
            }

            100% {
                left: calc(100% - 26px);
                opacity: 0;
            }
        }

        .progress-track {
            width: min(220px, 60vw);
            height: 3px;
            border-radius: 4px;
            background: var(--card);
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 18px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--purple-dark), var(--purple-500), var(--purple-400));
            animation: fill 2.4s cubic-bezier(.4, 0, .2, 1) forwards;
        }

        @keyframes fill {
            to {
                width: 100%;
            }
        }

        .status {
            font-size: 13px;
            color: var(--gray-500);
            font-weight: 500;
            letter-spacing: .01em;
            min-height: 18px;
        }

        .skip {
            margin-top: 34px;
            font-size: 12.5px;
            color: var(--gray-500);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 999px;
            background: transparent;
            font-family: inherit;
            cursor: pointer;
            transition: .18s;
        }

        .skip:hover,
        .skip:focus-visible {
            color: var(--white);
            border-color: var(--purple-500);
        }

        .skip:focus-visible {
            outline: 2px solid var(--purple-400);
            outline-offset: 2px;
        }

        @media (max-width: 380px) {
            .logo {
                margin-bottom: 36px;
            }

            .route {
                margin-bottom: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .loader,
            .logo .dot,
            .route-marker,
            .progress-fill {
                animation: none !important;
            }

            .loader {
                opacity: 1;
                transform: none;
            }

            .progress-fill {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="loader" id="loader">
        <div class="logo"><span class="dot"></span>Stackly</div>

        <div class="route" aria-hidden="true">
            <svg viewBox="0 0 280 2" preserveAspectRatio="none">
                <line class="route-line" x1="0" y1="1" x2="280" y2="1" />
            </svg>
            <div class="route-marker"><i class="fa-solid fa-location-dot"></i></div>
        </div>

        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <p class="status" id="status" aria-live="polite">Initializing dashboard…</p>

        <button class="skip" id="skip" type="button">Skip</button>
    </main>

    <script>
        (function () {
            var redirectUrl = './home.html';
            var loader = document.getElementById('loader');
            var statusEl = document.getElementById('status');
            var skipBtn = document.getElementById('skip');
            var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
            var totalDuration = reduced ? 500 : 2400;

            var messages = [
                { at: 0, text: 'Initializing dashboard…' },
                { at: 900, text: 'Loading your workspace…' },
                { at: 1700, text: 'Almost there…' }
            ];

            var timers = [];
            messages.forEach(function (m) {
                timers.push(setTimeout(function () {
                    statusEl.textContent = m.text;
                }, reduced ? 0 : m.at));
            });

            function goHome() {
                timers.forEach(clearTimeout);
                clearTimeout(redirectTimer);
                loader.classList.add('leaving');
                setTimeout(function () {
                    window.location.href = redirectUrl;
                }, reduced ? 0 : 320);
            }

            var redirectTimer = setTimeout(goHome, totalDuration);

            skipBtn.addEventListener('click', goHome);
        })();
    </script>
</body>

</html>
